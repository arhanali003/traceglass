<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">Traceglass investigation workflow</title><desc id="desc">Identify the artifact, inspect evidence, trace behavior, and explain the findings.</desc><rect width="1200" height="390" rx="20" fill="#0c1620"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="55" font-size="13" fill="#c4f268" font-weight="700">FROM ARTIFACT TO ANSWER</text><text x="48" y="103" font-size="34" fill="#e6efed" font-weight="700">Every conclusion has a trail.</text><rect x="48" y="143" width="264" height="174" rx="12" fill="#14252e" stroke="#2e454d"/><text x="68" y="179" font-size="13" fill="#c4f268" font-weight="700">01</text><text x="68" y="218" font-size="27" fill="#e6efed" font-weight="700">Identify</text><text x="68" y="255" font-size="16" fill="#e6efed" font-weight="400">Bind the target</text><text x="68" y="285" font-size="13" fill="#94acb7" font-weight="400">Path · version · digest</text><path d="M313 231h14m-5-5 5 5-5 5" fill="none" stroke="#c4f268" stroke-width="2"/><rect x="328" y="143" width="264" height="174" rx="12" fill="#14252e" stroke="#2e454d"/><text x="348" y="179" font-size="13" fill="#c4f268" font-weight="700">02</text><text x="348" y="218" font-size="27" fill="#e6efed" font-weight="700">Inspect</text><text x="348" y="255" font-size="16" fill="#e6efed" font-weight="400">Choose the evidence</text><text x="348" y="285" font-size="13" fill="#94acb7" font-weight="400">Code · metadata · runtime</text><path d="M593 231h14m-5-5 5 5-5 5" fill="none" stroke="#c4f268" stroke-width="2"/><rect x="608" y="143" width="264" height="174" rx="12" fill="#14252e" stroke="#2e454d"/><text x="628" y="179" font-size="13" fill="#c4f268" font-weight="700">03</text><text x="628" y="218" font-size="27" fill="#e6efed" font-weight="700">Trace</text><text x="628" y="255" font-size="16" fill="#e6efed" font-weight="400">Follow the behavior</text><text x="628" y="285" font-size="13" fill="#94acb7" font-weight="400">Entry point → output</text><path d="M873 231h14m-5-5 5 5-5 5" fill="none" stroke="#c4f268" stroke-width="2"/><rect x="888" y="143" width="264" height="174" rx="12" fill="#14252e" stroke="#2e454d"/><text x="908" y="179" font-size="13" fill="#c4f268" font-weight="700">04</text><text x="908" y="218" font-size="27" fill="#e6efed" font-weight="700">Explain</text><text x="908" y="255" font-size="16" fill="#e6efed" font-weight="400">Make it checkable</text><text x="908" y="285" font-size="13" fill="#94acb7" font-weight="400">Facts · inferences · gaps</text><text x="48" y="357" font-size="11" fill="#8099a5" font-weight="700">ONE PORTABLE SKILL</text><text x="825" y="357" font-size="13" fill="#b9c8ce" font-weight="400">Codex   /   Claude Code   /   Antigravity</text></g></svg>