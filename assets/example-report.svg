<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="525" viewBox="0 0 1200 525" role="img" aria-labelledby="title desc"><title id="title">Illustrated Traceglass report</title><desc id="desc">A readable CSV fixture beside observed findings and an explicitly unknown production behavior.</desc><rect width="1200" height="525" rx="20" fill="#0c1620"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="52" font-size="13" fill="#c4f268" font-weight="700">A CHECKABLE EXAMPLE</text><text x="48" y="98" font-size="30" fill="#e6efed" font-weight="700">Does export include archived contacts?</text><rect x="48" y="132" width="478" height="323" rx="12" fill="#101f29" stroke="#2e454d"/><text x="72" y="167" font-size="14" fill="#9bb4c1" font-weight="400">examples/demo-app/export.js</text><text x="72" y="205" font-family="monospace" font-size="13" fill="#b1c3cc">export function exportContacts(</text><text x="72" y="231" font-family="monospace" font-size="13" fill="#b1c3cc">  contacts, { includeEmail = false } = {}</text><text x="72" y="257" font-family="monospace" font-size="13" fill="#b1c3cc">) {</text><text x="72" y="283" font-family="monospace" font-size="13" fill="#b1c3cc">  // Select name; optionally include email.</text><text x="72" y="309" font-family="monospace" font-size="13" fill="#c4f268">  const rows = contacts.filter(</text><text x="72" y="335" font-family="monospace" font-size="13" fill="#c4f268">    contact =&gt; !contact.archived</text><text x="72" y="361" font-family="monospace" font-size="13" fill="#c4f268">  );</text><text x="72" y="387" font-family="monospace" font-size="13" fill="#b1c3cc">  // Escape cells and serialize CSV.</text><text x="72" y="413" font-family="monospace" font-size="13" fill="#b1c3cc">}</text><rect x="550" y="132" width="602" height="101" rx="12" fill="#14252e" stroke="#2e454d"/><rect x="550" y="148" width="3" height="69" rx="1" fill="#c4f268"/><text x="574" y="157" font-size="10" fill="#c4f268" font-weight="700">OBSERVED</text><text x="574" y="185" font-size="19" fill="#e6efed" font-weight="700">Archived contacts are filtered out.</text><text x="574" y="211" font-size="14" fill="#a1b7c1" font-weight="400">The predicate excludes truthy archived values.</text><rect x="550" y="242" width="602" height="101" rx="12" fill="#14252e" stroke="#2e454d"/><rect x="550" y="258" width="3" height="69" rx="1" fill="#94bfff"/><text x="574" y="267" font-size="10" fill="#94bfff" font-weight="700">OBSERVED</text><text x="574" y="295" font-size="19" fill="#e6efed" font-weight="700">Email is opt-in.</text><text x="574" y="321" font-size="14" fill="#a1b7c1" font-weight="400">The includeEmail parameter defaults to false.</text><rect x="550" y="352" width="602" height="101" rx="12" fill="#14252e" stroke="#2e454d"/><rect x="550" y="368" width="3" height="69" rx="1" fill="#e4bb86"/><text x="574" y="377" font-size="10" fill="#e4bb86" font-weight="700">UNKNOWN</text><text x="574" y="405" font-size="19" fill="#e6efed" font-weight="700">Production UI behavior is unverified.</text><text x="574" y="431" font-size="14" fill="#a1b7c1" font-weight="400">No caller or runtime observation was supplied.</text><text x="48" y="493" font-size="12" fill="#8ca5b1" font-weight="400">ILLUSTRATED STATIC ANALYSIS • excerpt abbreviated for display • not a live client screenshot</text></g></svg>