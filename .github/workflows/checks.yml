name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development checker
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Formatting
        run: python -m ruff format --check .
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Build and clean installation smoke check
        run: python scripts/smoke_release.py
      - name: Build local distribution
        run: python scripts/build_release.py --output dist/traceglass-beta.zip
